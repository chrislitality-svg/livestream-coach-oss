      ${sc?html`<div class=sc4>${[['product','产品'],['sales','销售'],['interact','互动'],['pace','节奏']].map(([k,l])=>html`<div>${l} <b>${sc[k]||0}</b>/5<i>${[1,2,3,4,5].map(t=>html`<u class="${Number(sc[k]||0)>=t?'on':''}"></u>`)}</i></div>`)}</div>`:''}</button>`};
  return html`<div class="row wrap" style="margin-bottom:14px;gap:8px"><span class="pill acc">${rs.length} 轮</span><span class=pill>已单轮分析 ${Object.keys(done).length} 轮</span><span class=muted style="font-size:12.5px">点已分析的轮次看完整拆解</span></div>
    ${rs.length?html`<div class=rounds>${rs.map(r=>card(r,done[r.idx]))}</div>`:html`<div class=card>${empty('这场还没做轮次切分','layers')}</div>`}
    ${customs.length?html`<div class=sect><h2>人工指定时段</h2><span class=note>${customs.length} 段</span></div><div class=rounds>${customs.map((c,i)=>html`<button class="rcard rv" data-act=round data-i="${-(i+1)}"><div class=h><b>段</b><span>${(c._meta||{}).product||''}</span><em>${mmss((c._meta||{}).dur)}</em></div><p>${(c.score||{}).comment||''}</p></button>`)}</div>`:''}`}
function sScript(s){
  const d=(s.deep||{}).script||{},st=d.structure||{},cp=d.core_point||{};
  return html`<div class="g g3" style="align-items:start">
    <div class="card rv"><div class=card-h><h3>讲解结构</h3></div><div class=card-b>
      <div class=lbl>开场</div><div style="font-size:13.5px;line-height:1.75">${st.opening||'—'}</div>
      <div class=lbl>流程</div><div class=steps>${(st.flow||[]).map(x=>html`<div>${x}</div>`)}</div>
      <div class=lbl>收口</div><div style="font-size:13px;line-height:1.7">${st.closing||'—'}</div>
      <div class=lbl>循环完整度</div><div style="font-size:13px;line-height:1.7;color:var(--warn)">${st.cycle||'—'}</div>
      <div class=lbl>核心卖点</div><div class=row style="justify-content:space-between"><b>${cp.what||'—'}</b><span class="pill acc">重复 ×${cp.repeat||0}</span></div>
      ${cp.judge?html`<div class=muted style="font-size:12.5px;margin-top:4px">${cp.judge}</div>`:''}</div></div>
    <div class="card rv" style="--i:1"><div class=card-h><h3>讲解逻辑链</h3><span class=note>${(d.logic_chains||[]).length} 条</span></div><div class=card-b>
      ${(d.logic_chains||[]).length?d.logic_chains.map(c=>html`<div class=item><div class=h>${c.point}<span class="tag d-sales" style="margin:0">${c.method}</span><span class=ts>${mmss(c.t||0)}</span></div><div class=x>${c.how}</div>${c.quote?html`<div class=quote>${c.quote}</div>`:''}</div>`):empty('暂无','layers',1)}</div></div>
    <div class="card rv" style="--i:2"><div class=card-h><h3>亮点与问题</h3></div><div class=card-b>
      <div class=lbl style="color:var(--ok)">值得学的</div>${(d.highlights||[]).length?d.highlights.map(h=>html`<div class="item ok"><div class=h><span class=ts>${mmss(h.t||0)}</span><span style="font-weight:500;font-size:12.5px;color:var(--ok)">${h.why}</span></div><div class=quote>${h.quote}</div></div>`):empty('暂无','layers',1)}
      <div class=lbl style="color:var(--warn)">要改的</div>${(d.issues||[]).length?d.issues.map(x=>html`<div class="item warn"><div class=h><span class=ts>${mmss(x.t||0)}</span>${x.problem}</div><div class=x>改法：${x.fix}</div></div>`):empty('暂无','layers',1)}</div></div></div>`}
function sAudience(s){
  const d=(s.deep||{}).audience||{},cs=d.concerns||[],mx=Math.max(1,...cs.map(c=>c.n||0));
  return html`${d.summary?html`<div class="callout acc rv" style="margin-bottom:14px">${icon('msg')}<div>${d.summary}</div></div>`:''}
    <div class="g g2" style="align-items:start">
    <div class="card rv"><div class=card-h><h3>观众关注的产品细节</h3><span class=note>${cs.length} 类 · 条长 = 提及次数</span></div><div class=card-b>
      ${cs.length?cs.map((c,i)=>html`<div style="padding:10px 0;border-bottom:1px dashed var(--line)">${meter(html`<b style="font-weight:600;color:var(--fg)">${c.topic}</b>`,(c.n||0)+' 条',(c.n||0)/mx,{color:c.answered?'var(--ok)':'var(--bad)',i,lw:150,vw:52})}
        <div class=row style="gap:6px;flex-wrap:wrap"><span class="pill ${c.answered?'ok':'bad'}">${c.answered?'已回应':'未回应'}</span>${(c.samples||[]).slice(0,3).map(x=>html`<span class=muted style="font-size:12px">「${x}」</span>`)}</div></div>`):empty('暂无','msg',1)}</div></div>
    <div class=g style="align-content:start">
      <div class="card rv" style="--i:1"><div class=card-h><h3>没被回应的提问</h3><span class=note>${(d.unanswered||[]).length} 条</span></div><div class=card-b>
        ${(d.unanswered||[]).length?d.unanswered.map(x=>html`<div class="item bad"><div class=h>${x.question}</div><div class=quote>${x.sample}</div></div>`):empty('都回应了','check',1)}</div></div>
      <div class="card rv" style="--i:2"><div class=card-h><h3>顾虑与质疑</h3></div><div class=card-b>
        ${(d.doubts||[]).length?d.doubts.map(x=>html`<div class="item warn"><div class=h>${x.doubt}</div><div class=quote>${x.sample}</div></div>`):empty('无','check',1)}
        ${(d.positive||[]).length?html`<div class=lbl style="color:var(--ok)">正面反馈</div>${d.positive.map(x=>html`<div class="item ok"><div class=d>${x}</div></div>`)}`:''}</div></div></div></div>`}
function sVisual(s){
  const d=(s.deep||{}).visual||{},an=d.anchor||{};
  const li=(arr,cls)=>arr&&arr.length?arr.map(x=>html`<div class="item ${cls||''}"><div class=d>${x}</div></div>`):empty('暂无','layers',1);
  return html`<div class="g g3" style="align-items:start">
    <div class="card rv"><div class=card-h><h3>场景与服化道</h3></div><div class=card-b>
      <div style="font-size:13.5px;line-height:1.8">${d.scene||'—'}</div>
      <div class=lbl>主播形象</div><div style="font-size:13px;line-height:1.7">${an.look||'—'}</div>
      ${an.fit&&an.fit.verdict?html`<div class=lbl style="color:${an.fit.verdict==='一致'?'var(--ok)':an.fit.verdict==='不搭'?'var(--warn)':'inherit'}">造型适配（标准 3.1）：${an.fit.verdict}</div>
        <div style="font-size:13px;line-height:1.7">${an.fit.reason||''}${an.changes?html`<br>${an.changes}`:''}</div>`:''}
      <div class=lbl>主要动作</div><div style="font-size:13px;line-height:1.7">${an.action||'—'}</div></div></div>
    <div class="card rv" style="--i:1"><div class=card-h><h3>道具与展示手法</h3><span class=note>${(d.props||[]).length} 件道具</span></div><div class=card-b>
      ${(d.props||[]).map(x=>html`<div class=item><div class=h>${x.name}</div><div class=x>${x.usage}</div></div>`)}
      <div class=lbl>商品展示手法</div>${(d.display||[]).map(x=>html`<div class="item ok"><div class=h>${x.method}</div><div class=x>${x.detail}</div></div>`)}</div></div>
    <div class="card rv" style="--i:2"><div class=card-h><h3>可借鉴技巧</h3></div><div class=card-b>${li(d.techniques,'ok')}
      ${(d.screen_elements||[]).length?html`<div class=lbl>画面信息元素</div>${li(d.screen_elements,'mute')}`:''}
      ${(d.issues||[]).length?html`<div class=lbl style="color:var(--warn)">呈现问题</div>${li(d.issues,'warn')}`:''}</div></div></div>`}
function sVMetrics(s){
  const V=s.visual_metrics||{},D2=V.derived||{};
  const props=(V.props||[]).map((x,i)=>meter(x.v,x.pct+'%',x.pct/100,{i,lw:118,color:'var(--c-s)'}));
  return html`<div class="row wrap" style="margin-bottom:14px;gap:8px"><span class="pill acc">本场抽 ${V.n_frames} 帧逐帧标注</span><span class=pill>全场 ${(s.frame_secs||[]).length} 张截图中均匀抽样</span></div>
    <div class="g g3" style="align-items:start">
      <div class="card rv"><div class=card-h><h3>妆造与服装</h3></div><div class=card-b>${distBars(V.dist||{},V.examples,['makeup.level','makeup.hair','outfit.type','outfit.color','outfit.style'])}</div></div>
      <div class="card rv" style="--i:1"><div class=card-h><h3>站位与镜头</h3></div><div class=card-b>${distBars(V.dist||{},V.examples,['staging.shot','staging.hpos','staging.product','staging.gaze','staging.ratio'])}</div></div>
      <div class=g style="align-content:start"><div class="card rv" style="--i:2"><div class=card-h><h3>场景</h3></div><div class=card-b>${distBars(V.dist||{},V.examples,['scene.bg','scene.tone','scene.density','scene.light','scene.price_shown'])}</div></div>
        <div class="card rv" style="--i:3"><div class=card-h><h3>道具使用率</h3></div><div class=card-b>${props.length?props:empty('暂无','layers',1)}</div></div></div></div>
    ${Object.keys(D2).length?html`<div class=sect><h2>本场量化指标</h2></div><div class=dtiles>${Object.keys(D2).map((k,i)=>{const x=D2[k]||{};
      const v=x.value!=null?x.value:(x.pct!=null?x.pct+'%':(x.main||'—'));
      return html`<div class="dtile rv" style="--i:${i}"><div class=k>${k}</div><div class=d>${x.desc||VDESC[k]||''}</div><b>${v}</b></div>`})}</div>`:''}`}
function sTMetrics(s){
  const T=s.talk||{},g=T.groups||{},order=[['塑品','var(--c-p)'],['逼单','var(--c-s)'],['互动','var(--c-i)']],pg=T.push_gap;
  return html`<div class="card rv"><div class=card-h><h3>话术结构</h3><span class=note>按时间轴切出三类话术，一段含多类时按时长均分</span></div><div class=card-b>
      ${stack([...order.map(([k,c])=>({v:(g[k]||{}).pct||0,c,n:k})),{v:T.other?T.other.pct:0,c:'var(--c-o)',n:'其他'}],1)}
      <div class="g g3" style="margin-top:16px">${order.map(([k,c],i)=>{const x=g[k]||{};
        return html`<div class="kpi rv" style="--i:${i};border-top:3px solid ${c}"><i>${x.name||k}</i><b>${x.pct||0}<small>%</small></b>
          <div class=s>${Math.round((x.sec||0)/60)} 分钟 · ${x.segments||0} 段 · ${x.per_min||0} 次/分</div>
          <div class=s>单次均长 ${Math.round(x.avg_span_sec||0)} 秒 · 覆盖 ${x.coverage_decile||0}/10 段</div>
          ${(x.top||[]).length?html`<div style="margin-top:6px">${x.top.slice(0,3).map(t=>html`<span class=tag>${t.name} ×${t.n}</span>`)}</div>`:''}</div>`})}</div></div></div>
    ${pg?html`<div class="card rv" style="--i:2;margin-top:14px"><div class=card-h><h3>促单空窗</h3><span class=note>连续没提促单的最长时间</span></div><div class=card-b style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">
      ${ring(Math.round(pg.max_sec),Math.max(300,Math.round(pg.max_sec)),{size:120,color:pg.max_sec>120?'var(--warn)':'var(--ok)',sub:'秒 · 最长空窗'})}
      <div style="flex:1;min-width:240px"><div style="font-size:14px">最长 <b>${Math.round(pg.max_sec)}</b> 秒，出现在 <span class=ts>${mmss(pg.max_at)}</span></div>
        <div class=muted style="font-size:12.5px;margin-top:6px">超 60 秒的空窗 <b>${pg.over_60s}</b> 次${pg.over_60s?'（观众想买时没人推）':'（促单密度很好）'}</div>
        ${(pg.worst||[]).slice(0,4).map(w=>html`<div class="item warn"><div class=d><span class=ts>${mmss(w.start)}</span>起，空窗 <b>${Math.round(w.sec)}</b> 秒</div></div>`)}</div></div></div>`:''}
    <div class=muted style="font-size:12px;margin-top:12px">同品类标杆均值请到「话术量化」页对比 · <a href="${href('talk',{c:s.category||''})}" style="color:var(--acc)">去对比 →</a></div>`}

VIEWS.s=async q=>{
  const p=q.get('p');if(!p)return {redirect:['board',{}]};
  const s=await API.session(p);
  if(!s)return {title:'场次',html:page(html`<div class=card>${empty('找不到这一场','film')}</div>`)};
  CUR=s;
  const room=API.room(p),meta=API.meta(p)||{};
  const name=s.name||(room&&room.name)||meta.name||'场次',cat=s.category||(room&&room.category)||'',grp=s.group||(room&&room.group)||meta.group;
  const sibs=room?room.sessions.slice().sort((a,b)=>String(b.started).localeCompare(String(a.started))):[];
  const dp=s.deep||{},m=s.metrics||{};
  const has={overview:1,rounds:(s.rounds||[]).length,script:dp.script,audience:dp.audience,visual:dp.visual,
    vmetrics:s.visual_metrics&&s.visual_metrics.n_frames,tmetrics:s.talk&&s.talk.groups};
  const t=has[q.get('t')||'overview']?(q.get('t')||'overview'):'overview';
  const fr=s.frame_secs||[],pg=gal(fr.map(x=>({src:API.frame(p,x),cap:name,sub:mmss(x)})));
  const lastF=fr.length?fr[fr.length-1]:1e9;
  const recording=s.done===false||(room&&room.recording&&sibs[0]&&sibs[0].path===p);
  const k=(l,v,u)=>html`<div class="kpi sm rv"><i>${l}</i><b>${v}${u?html`<small>${u}</small>`:''}</b></div>`;
  const body={overview:sOverview,rounds:sRounds,script:sScript,audience:sAudience,visual:sVisual,vmetrics:sVMetrics,tmetrics:sTMetrics}[t](s);
  return {title:name,html:page(html`
    <div class=shead>
      <div class=poster data-act=lb data-g="${pg}" data-i="${Math.max(0,fr.length-1)}" title="翻看这场的全部截图">${img(API.frame(p,lastF))}</div>
      <div style="min-width:0;flex:1">
        <div class=row style="gap:8px"><a href="#/board" data-act=back class="btn ghost sm">${icon('left')}返回</a>${recording?html`<span class=livepill><span class=dot></span>录制中</span>`:''}</div>
        <h1 style="margin-top:10px">${name}</h1>
        <div class=meta>${grpPill(grp)}${cat?html`<span class=pill>${cat}</span>`:''}<span class=mono>${when(s.started||meta.started)}</span><span>·</span><span>${dur(s.elapsed)}</span>
          ${s.analyzed===false?html`<span class="pill warn">未分析</span>`:''}</div>
        ${sibs.length>1?html`<div class=sessbar>${sibs.map(x=>html`<a href="${href('s',{p:x.path,t:t==='overview'?'':t})}" class="${x.path===p?'on':''}">${when(x.started)} · ${durS(x.elapsed)}${x.analyzed?html` <span class=ok>✓</span>`:''}</a>`)}</div>`:''}
      </div>
      <div class=acts>
        ${s.has_report?html`<a class="btn ghost" href="${API.report(p)}" target=_blank rel=noopener>${icon('file')}完整报告${icon('ext')}</a>`:''}
        ${grp==='own'&&s.analyzed!==false?html`<a class="btn ghost" href="${href('target',{p})}">${icon('target')}靶向诊断</a>`:''}
        ${s.analyzed!==false?html`<a class=btn href="${href('compare',grp==='own'?{a:p}:{b:p})}">${icon('versus')}拿去对标</a>`:''}
      </div></div>
    <div class="kpis k8">
      ${k('时长',durS(s.elapsed))}${k('转写',num(s.transcript_chars||s.chars||0),'字')}${k('语速',m['语速_字每分']!=null?m['语速_字每分']:'—','字/分')}
      ${k('弹幕',num(s.danmu||0))}${k('其中刷屏',s.spam_total||0,'条')}${k('行动指令',m['行动指令_次每分']!=null?m['行动指令_次每分']:'—','次/分')}
      ${k('购买意向',m['购买意向弹幕']!=null?m['购买意向弹幕']:'—','条')}${k('最长无逼单',m['最长无逼单间隔_秒']!=null?Math.round(m['最长无逼单间隔_秒']):'—','秒')}</div>
    <nav class=tabs>${STABS.map(([id,l])=>html`<a href="${href('s',{p,t:id==='overview'?'':id})}" class="${id===t?'on':''} ${has[id]?'':'off'}">${l}${has[id]?'':' ·无'}</a>`)}</nav>
    ${body}`),
    mount:root=>{if(t==='overview')tlMount(root,s)}}};

ACT.retry=()=>{if(!API.base){location.reload();return}API._m.clear();API._c.clear();route()};
(async function boot(){
  applyTheme(Pref.get('theme','auto'));
  if(Pref.get('mini',false))$('#shell').classList.add('mini');
  $('.menu-btn').innerHTML=put(icon('menu'));
  $('#searchbtn').innerHTML=put(html`${icon('search')}<span>搜索直播间、主播、页面…</span><kbd>${MODK}</kbd>`);
  sideFoot();navRender('board');
  try{await API.boot()}
  catch(e){console.error(e);$('#main').innerHTML=put(errView(e).html);return}
  statsRender();
  await route();
  API.docsIndex().catch(()=>{});   // 命令面板能直接搜到每份交付物
  let stale=false;
  const busy=()=>{const a=document.activeElement;
    return !!(a&&a!==document.body&&a.closest&&a.closest('#main')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))||
      !!$('.cover.scrubbing')||$('#shell').classList.contains('open')};
  if(!STATIC)setInterval(async()=>{
    if(document.hidden||OV.stack.length)return;
    try{const ch=await API.poll();statsRender();stale=stale||ch;
      if(stale&&R.view==='board'&&!busy()){stale=false;R.quiet=true;route()}}catch(e){}},5000);
})();
</script>
